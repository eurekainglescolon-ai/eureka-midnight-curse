<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eureka — The Midnight Curse LIVE</title><style>:root{font-family:system-ui;background:#101527;color:#f8f9ff}body{max-width:950px;margin:auto;padding:18px}h1{color:#a4e4ff}button,input{font:inherit;padding:12px;border-radius:9px;border:1px solid #7580a0}button{background:#57d8b0;color:#092019;font-weight:700;cursor:pointer}input{background:#242b44;color:white;max-width:95%}.card{background:#222941;padding:18px;margin:13px 0;border-radius:14px}.muted{color:#b9c5df}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.ok{color:#6ef3bd}.bad{color:#ffadad}a{color:#9ce7ff}#timer{font-size:2rem;font-weight:800} .hidden{display:none}</style></head><body><h1>🎃 The Midnight Curse — LIVE</h1><p class="muted">Eureka B1 • Four teams • One haunted school • 60 minutes</p><p><a href="/teacher.html">Teacher's live dashboard</a></p><section id="entry" class="card"><h2>Enter your team</h2><input id="name" placeholder="Team name"><button onclick="join()">Join the game</button><p id="joinmsg"></p></section><section id="game" class="hidden"><div class="card"><h2 id="team"></h2><div id="timer">Waiting for teacher…</div><p id="stats"></p></div><div id="puzzles" class="grid"></div><div id="finish" class="card hidden"></div></section><script src="/socket.io/socket.io.js"></script><script>
const s=io();let session=JSON.parse(localStorage.getItem('eureka-session')||'null'),state=null,solved=[],hints=[];let qs=[];const $=x=>document.getElementById(x);function send(event,data,cb){s.emit(event,data,cb)}function join(){send('join',{name:$('name').value},r=>{if(r.error)return $('joinmsg').textContent=r.error;session={id:r.id,token:r.token};localStorage.setItem('eureka-session',JSON.stringify(session));load(r)})}function load(r){qs=r.challenges;solved=r.solved||[];hints=r.hints||[];$('entry').classList.add('hidden');$('game').classList.remove('hidden');$('team').textContent='Team: '+(state?.teams.find(t=>t.id===session.id)?.name||'Ready');render()}function render(){if(!session)return;let t=state?.teams.find(t=>t.id===session.id);if(t)$('team').textContent='Team: '+t.name;$('stats').textContent=`Solved ${solved.length}/8 • Penalty ${Math.round((t?.penalty||0)/1000)} seconds`;let html='';qs.forEach(q=>{let done=solved.includes(q.index);html+=`<article class="card"><h3>${done?'✅ ':''}${q.index+1}. ${q.title}</h3><p>${q.prompt}</p>${done?'<strong class="ok">Solved!</strong>':`<input id="a${q.index}" placeholder="Your answer" aria-label="Answer for puzzle ${q.index+1}"><button onclick="answer(${q.index})">Unlock</button><button onclick="hint(${q.index})">Hint (+2 min)</button><p id="m${q.index}" class="muted"></p>`}</article>`});$('puzzles').innerHTML=html;if(t?.finishedAt){$('finish').classList.remove('hidden');$('finish').textContent=`🎉 Escaped! Official adjusted time: ${Math.round(t.adjusted/1000)} seconds. Show your teacher!`}}function answer(index){send('answer',{...session,index,answer:$('a'+index).value},r=>{if(r.error)return $('m'+index).textContent=r.error;if(r.correct){solved=r.solved;render()}else{$('m'+index).textContent='Incorrect. +30 seconds penalty.';renderStats()}})}function renderStats(){let t=state?.teams.find(t=>t.id===session.id);$('stats').textContent=`Solved ${solved.length}/8 • Penalty ${Math.round((t?.penalty||0)/1000)} seconds`;}function hint(index){send('hint',{...session,index},r=>{if(r.error)return $('m'+index).textContent=r.error;$('m'+index).textContent='Hint: '+r.hint})}s.on('connect',()=>{if(session)send('resume',session,r=>{if(r.error){localStorage.removeItem('eureka-session');session=null;return}load(r)})});s.on('state',v=>{state=v;if(session&&qs.length)renderStats()});setInterval(()=>{if(!state?.startedAt){$('timer').textContent='Waiting for teacher…';return}let left=Math.max(0,state.duration-(Date.now()-state.startedAt)),m=Math.floor(left/60000),sec=Math.floor(left%60000/1000);$('timer').textContent=`⏳ ${m}:${String(sec).padStart(2,'0')}`;if(session&&state.teams.some(t=>t.id===session.id&&t.finishedAt))render()},1000);
</script></body></html>
