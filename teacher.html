<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eureka Live Leaderboard</title><style>body{font:20px system-ui;background:#111729;color:white;max-width:1050px;margin:auto;padding:24px}h1{color:#81e7d0}.team{padding:22px;margin:14px 0;background:#29324a;border-radius:12px;display:flex;justify-content:space-between;gap:10px}button,input{font:inherit;padding:10px;border-radius:8px}button{background:#82e6c3;border:0}#clock{font-size:3rem;font-weight:800}small{color:#c4cbe0}</style></head><body><h1>🎃 The Midnight Curse — Teacher Dashboard</h1><p>Display this page on the whiteboard. Students join from the main URL.</p><label>Teacher PIN <input type="password" id="pin"></label><button onclick="action('start')">Start all teams</button><button onclick="action('reset')">Reset competition</button><p id="msg"></p><div id="clock">Waiting to start</div><h2>Live leaderboard</h2><div id="board"></div><h2 id="winner"></h2><script src="/socket.io/socket.io.js"></script><script>const s=io();let state=null;function action(e){if(e==='reset'&&!confirm('Reset ALL team progress?'))return;s.emit(e,{pin:document.getElementById('pin').value},r=>document.getElementById('msg').textContent=r.error||'Success')}s.on('state',v=>{state=v;draw()});function fmt(ms){let sec=Math.round(ms/1000);return `${Math.floor(sec/60)}m ${sec%60}s`}function draw(){if(!state)return;let teams=[...state.teams].sort((a,b)=>b.solved-a.solved||(a.adjusted??Infinity)-(b.adjusted??Infinity));document.getElementById('board').innerHTML=teams.map((t,i)=>`<div class="team"><strong>${i+1}. ${t.name.replaceAll('&','&amp;').replaceAll('<','&lt;')}</strong><span>${t.solved}/8 solved</span><span>Penalty: ${fmt(t.penalty)}</span><span>${t.finishedAt?'ESCAPED — '+fmt(t.adjusted):'Playing'}</span></div>`).join('')||'<p>Waiting for teams to join…</p>';let finished=state.teams.filter(t=>t.finishedAt).sort((a,b)=>a.adjusted-b.adjusted);document.getElementById('winner').textContent=finished.length?'🏆 Current leader: '+finished[0].name:''}setInterval(()=>{if(!state?.startedAt)return;let remaining=Math.max(0,state.duration-(Date.now()-state.startedAt));document.getElementById('clock').textContent='⏳ '+fmt(remaining)},1000)</script></body></html>
